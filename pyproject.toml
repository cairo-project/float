[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "float"
version = "0.1.0"
description = "FLOAT: Generative Motion Latent Flow Matching for Audio-driven Talking Portrait"
requires-python = ">=3.10"
dependencies = [
    "torch==2.0.1",
    "torchvision==0.15.2",
    "torchaudio==2.0.2",
    "pyyaml",
    "opencv-python",
    "pandas",
    "tqdm",
    "matplotlib",
    "flow-vis",
    "librosa",
    "transformers==4.30.2",
    "albumentations==1.4.15",
    "albucore==0.0.16",
    "torchdiffeq==0.2.5",
    "timm==1.0.9",
    "face_alignment==1.4.1",
    "av==12.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu118" }]
torchvision = [{ index = "pytorch-cu118" }]
torchaudio = [{ index = "pytorch-cu118" }]

[project.scripts]
generate-float = "generate:main"

[tool.setuptools]
py-modules = ["generate"]

[tool.setuptools.packages.find]
where = ["."]
include = ["float*", "models*", "options*"]
